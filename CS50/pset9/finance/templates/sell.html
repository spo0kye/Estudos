{% extends "layout.html" %}

{% block main %}
<form action="/sell" method="post">
    <h1>Sell</h1>
    </div class="form-group">
        <input id="stock" autocomplete="phold" autofocus class="form-control" name="stock" placeholder="stock symbol" type="text">
    </div>
    <div class="form-group">
        <input id="amount" class="form-control" name="amount" placeholder="Amount" type="number" min="1" max="{{ max }}">
    </div>
    <button class="btn btn-primary" type="submit">Buy</button>
</form>

<table class="table">
    <thead>
        <tr>
            <th scope="col">Stock</th>
            <th scope="col">Quantity</th>
            <th scopé="col">Value</th>
            <th scopé="col">Total value</th>
        </tr>
    </thead>
    {% for rows in possession %}
        <tr>
          <td>{{ rows.stock }}</td>
          <td>{{ rows.quantity }}</td>
          <td>{{ total[ns.i] }}</td>
          {% set ns.i = ns.i + 1 %}
        </tr>
    {% endfor %}
</table>
{% endblock %}
