{% extends "layout.html" %}

{% block main %}
<form action="/buy" method="post">
    <div class="form-group">
        <input id="stock" autocomplete="off" autofocus class="form-control" name="stock" placeholder="stock symbol" type="text">
    </div>
    <div class="form-group">
        <input id="amount" class="form-control" name="amount" placeholder="Amount" type="number">
    </div>
    <button class="btn btn-primary" type="submit">Buy</button>
</form>


{% endblock  %}
