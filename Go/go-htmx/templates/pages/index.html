{{define "content"}}

        hx-post="/increment"
        hx-target="#counter"
        hx-swap="innerHTML">

    <button
        hx-get="/pizzas",
        hx-target="pizzas"
        hx-swap="innerHTML"
        >
        show pizzas

    <div id="pizzas"></div>
{{end}}
