{{ define "layout" }}
<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
    <h1>Menu</h1>
    {{ template "pizzas" .}}
    <form 
    hx-post="/pizzas/add"
    hx-target="#pizzas"

        <input name="price">

        <button>Adicionar</button>
    </form>
</button>

</html>
{{ end }}
